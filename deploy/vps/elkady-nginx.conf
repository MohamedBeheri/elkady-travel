# /etc/nginx/sites-available/elkady
# A SEPARATE Nginx server block for ELKADY TRAVEL. Do not edit the MPFC block.
# It coexists with MPFC on ports 80/443 by matching its own server_name.
#
# ── Option A (recommended): a domain / subdomain ──────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name elkady-travel.com www.elkady-travel.com;

    client_max_body_size 25M;         # payment-proof / receipt uploads

    # Serve uploaded media straight from disk (fast). Django can serve it too,
    # but this offloads Nginx.
    location /media/ {
        alias /opt/elkady/backend/media/;
        access_log off;
        expires 7d;
    }

    # Everything else (SPA + API + Django static via WhiteNoise) → Gunicorn.
    location / {
        proxy_pass http://unix:/run/elkady/gunicorn.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── Option B: no domain — reach it by IP on a dedicated port ───────────────────
