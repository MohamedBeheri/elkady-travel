databases:
  - name: elkady-travel-db
    plan: free
    databaseName: elkady
    user: elkady

services:
  - type: web
    name: elkady-travel
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      # Persistent PostgreSQL — data survives redeploys/restarts (unlike ephemeral SQLite).
      - key: DATABASE_URL
        fromDatabase:
          name: elkady-travel-db
          property: connectionString
